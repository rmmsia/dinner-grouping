name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allows manual triggering
      inputs:
        tag_name:
          description: 'Release tag'
          required: true
          default: 'v1.0.0'


jobs:
  build_mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build with PyInstaller for macOS
        run: |
          pyinstaller --onefile --add-data "templates/*:templates" src/app.py
          
          # Make sure the executable has right permissions
          chmod +x dist/app
          
          # Package in a zip to preserve permissions
          cd dist && zip -r "dinner-grouping-mac.zip" app && cd ..
      
      - name: Upload macOS build to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/dinner-grouping-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    runs-on: windows-latest  # Build for Windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'  # Using same version as macOS for consistency

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller for Windows
        run: |
          pyinstaller --onefile --add-data "templates/index.html;templates" src/app.py
          
          # Rename to a more descriptive name
          move dist\app.exe dist\dinner-grouping.exe
          
          # Zip for distribution
          powershell Compress-Archive -Path "dist\dinner-grouping.exe" -DestinationPath "dist\dinner-grouping-windows.zip"

      - name: Upload Windows build to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: dist/dinner-grouping-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: [build_mac, build_windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create unified release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/dinner-grouping-mac.zip
            dist/dinner-grouping-windows.zip
          name: ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## Installation Instructions
            
            ### macOS Users
            1. Download the `dinner-grouping-mac.zip` file
            2. Extract the zip file
            3. Open Terminal and navigate to the extracted folder
            4. Make the file executable: `chmod +x app`
            5. The app should be able to run now. You should be able to subsequently double click to run it.
            6. If you get security warnings, go to System Preferences → Security & Privacy and click "Open Anyway"
            
            ### Windows Users
            1. Download the `dinner-grouping-windows.zip` file
            2. Extract the zip file
            3. Run `dinner-grouping.exe` directly
            4. If Windows SmartScreen appears, click "More info" and then "Run anyway"
            
            ### Troubleshooting
            
            #### macOS
            * Make sure the app is executable:
              ```
              chmod +x app
              ```
            * Run from Terminal to see any error messages:
              ```
              ./app
              ```
            
            #### Windows
            * If the executable doesn't run, try running it from Command Prompt to see any error messages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}