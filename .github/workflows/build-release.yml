name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on new tags starting with 'v', e.g., 'v1.0.0'
  pull_request:
    branches:
      - main  # Or your default branch
  workflow_dispatch:  # Allows manual triggering
      inputs:
        tag_name:
          description: 'Release tag'
          required: true
          default: 'v1.0.0'


jobs:
  build_mac:
    runs-on: macos-latest  # Build for macOS
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'  # Adjust as needed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Ensure PyInstaller is installed here

      - name: Build with PyInstaller for macOS
        run: |
          pyinstaller --onefile --distpath dist/ --workpath build/ --specpath src/ src/app.py  # Adjusted for src/app.py path

      - name: Upload macOS build to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: dist/app  # Path to your built macOS executable (app.py will be compiled to app)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    runs-on: windows-latest  # Build for Windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.12'  # Adjust as needed

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Ensure PyInstaller is installed here

      - name: Build with PyInstaller for Windows
        run: |
          pyinstaller --onefile --distpath dist/ --workpath build/ --specpath src/ --add-data "/templates/index.html:templates" src/app.py

      - name: Upload Windows build to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: dist/app.exe  # Path to your built Windows executable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest  # This job runs after the builds complete
    needs: [build_mac, build_windows]  # This ensures the release job runs only after both builds are successful
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Upload both builds to the same GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/app  # macOS build
            dist/app.exe  # Windows build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
