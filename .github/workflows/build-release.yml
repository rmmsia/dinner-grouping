name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allows manual triggering
      inputs:
        tag_name:
          description: 'Release tag'
          required: true
          default: 'v1.0.0'


jobs:
  build_mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build with PyInstaller for macOS
        run: |
          pyinstaller --onefile --add-data "templates/*:templates" src/app.py
          
          # Make sure the executable has right permissions
          chmod +x dist/app
          
          # Create a macOS app launcher script
          cat > dist/run-dinner-grouping.command << 'EOL'
          #!/bin/bash
          # Get the directory where this script is located
          DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
          # Run the app executable from that directory
          "$DIR/app"
          EOL
          
          # Make the launcher script executable
          chmod +x dist/run-dinner-grouping.command
          
          # Package everything in a zip to preserve permissions
          cd dist && zip -r "dinner-grouping-mac.zip" app run-dinner-grouping.command && cd ..
      
      - name: Upload macOS build to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/dinner-grouping-mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_windows:
    runs-on: windows-latest  # Build for Windows
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'  # Using same version as macOS for consistency

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller for Windows
        run: |
          pyinstaller --onefile --add-data "templates/index.html;templates" src/app.py
          
          # Rename to a more descriptive name
          move dist\app.exe dist\dinner-grouping.exe
          
          # Create a simple batch file launcher
          echo @echo off > dist\run-dinner-grouping.bat
          echo start dinner-grouping.exe >> dist\run-dinner-grouping.bat
          
          # Zip everything for distribution
          powershell Compress-Archive -Path "dist\dinner-grouping.exe","dist\run-dinner-grouping.bat" -DestinationPath "dist\dinner-grouping-windows.zip"

      - name: Upload Windows build to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: dist/dinner-grouping-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    needs: [build_mac, build_windows]
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create unified release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/dinner-grouping-mac.zip
            dist/dinner-grouping-windows.zip
          name: Dinner Grouping ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## Dinner Grouping Tool
            
            ### Installation Instructions
            
            #### macOS Users
            1. Download the `dinner-grouping-mac.zip` file
            2. Extract the zip file
            3. **Option 1:** Double-click the `run-dinner-grouping.command` file to launch the app
            4. **Option 2:** Open Terminal, navigate to the extracted folder, and run `./app`
            5. If you get security warnings, go to System Preferences → Security & Privacy and click "Open Anyway"
            
            #### Windows Users
            1. Download the `dinner-grouping-windows.zip` file
            2. Extract the zip file
            3. Double-click the `run-dinner-grouping.bat` file OR run `dinner-grouping.exe` directly
            4. If Windows SmartScreen appears, click "More info" and then "Run anyway"
            
            ### Troubleshooting
            
            #### macOS
            * If the `.command` file doesn't work, make it executable by opening Terminal and running:
              ```
              chmod +x path/to/run-dinner-grouping.command
              ```
            * If you still have issues, try running the app directly in Terminal:
              ```
              cd path/to/extracted/folder
              chmod +x app
              ./app
              ```
            
            #### Windows
            * If the executable doesn't run, try running it from Command Prompt to see any error messages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}